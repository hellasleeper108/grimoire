[workspace]
resolver = "2"
members = ["crates/grim-core", "crates/grim", "crates/grimd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/hellasleeper108/grimoire"

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base32 = "0.5"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
